<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="src/css/unsonet-styles.css" />
    <link rel="stylesheet" type="text/css" href="popup.css" />
</head>

<body>
    <details id="gainPanel" open>
        <summary>
            <div class="summary-container"><span>Gain</span>
                <div class="reset-icon" data-section="#gainPanel"></div>
            </div>
        </summary>
        <div class="control"><label>Output: <span id="gainOutputVal">0 dB</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="gainOutputDb" min="-24" max="24" step="0.5" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control" style="margin-top:10px;"><label>Effects Mix: <span id="effectsMixVal">100%</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="effectsMix" min="0" max="100" step="1" value="100">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
    </details>
    <details id="pitchSettingsPanel">
        <summary>
            <div class="summary-container">
                <span>Pitch</span>
                <div class="reset-icon" data-section="#pitchSettingsPanel"></div>
            </div>
        </summary>
        <div class="control">
            <label>Pitch Shift (semitones): <span id="semitonesVal">0</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="semitones" min="-12" max="12" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control">
            <label>Pitch Fine Shifting (cents): <span id="centsVal">0</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="cents" min="-50" max="50" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control">
            <label>Block Size (ms): <span id="blockSizeVal">120</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="blockSize" min="20" max="150" step="5" value="120">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="row">
            <input type="checkbox" id="smartProcessing" checked>
            <label>Smart processing</label>
        </div>
    </details>
    <details id="speedSettingsPanel">
        <summary>
            <div class="summary-container">
                <span>Speed</span>
                <div class="reset-icon" data-section="#speedSettingsPanel"></div>
            </div>
        </summary>
        <div class="control">
            <label>Speed Shift: <span id="speedUnitsVal">100%</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="speedUnits" min="-75" max="60" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control">
            <label>Speed Fine Shifting: <span id="speedFineVal">100%</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="speedFine" min="-5" max="5" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="row">
            <input type="checkbox" id="preservePitch" checked>
            <label>Preserve pitch</label>
        </div>
    </details>
    <details id="eqSettingsPanel">
        <summary>
            <div class="summary-container">
                <span>Equalizer</span>
                <div class="reset-icon" data-section="#eqSettingsPanel"></div>
            </div>
        </summary>
        <div class="eq-presets" style="display:flex;gap:8px;align-items:center;">
            <select id="eqPreset">
                <option value="flat">Flat</option>
                <option value="rock">Rock</option>
                <option value="pop">Pop</option>
                <option value="classical">Classical</option>
                <option value="bass">Bass Boost</option>
            </select>
            <button id="eqPresetManageBtn" class="btn-vk link" type="button">Manage</button>
        </div>
        <div class="eq-row">
            <div class="eq-container">
                <svg class="eq-svg legend-bottom" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path class="eq-svg-line-shadow" d=""></path>
                    <path class="eq-svg-line" d=""></path>
                </svg>
                <div class="range-slider legend-bottom" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                    <div class="range-slider__legend-bottom">31</div>
                </div>
                <div class="range-slider legend-bottom" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                    <div class="range-slider__legend-bottom">62</div>
                </div>
                <div class="range-slider legend-bottom" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                    <div class="range-slider__legend-bottom">125</div>
                </div>
                <div class="range-slider legend-bottom" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                    <div class="range-slider__legend-bottom">250</div>
                </div>
                <div class="range-slider legend-bottom" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                    <div class="range-slider__legend-bottom">500</div>
                </div>
                <div class="range-slider legend-bottom" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                    <div class="range-slider__legend-bottom">1K</div>
                </div>
                <div class="range-slider legend-bottom" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                    <div class="range-slider__legend-bottom">2K</div>
                </div>
                <div class="range-slider legend-bottom" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                    <div class="range-slider__legend-bottom">4K</div>
                </div>
                <div class="range-slider legend-bottom" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                    <div class="range-slider__legend-bottom">8K</div>
                </div>
                <div class="range-slider legend-bottom" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                    <div class="range-slider__legend-bottom">16K</div>
                </div>
            </div>
        </div>
    </details>

    <details id="reverbPanel">
        <summary>
            <div class="summary-container"><span>Reverb</span>
                <div class="reset-icon" data-section="#reverbPanel"></div>
            </div>
        </summary>
        <div class="control">
            <label>Reverb Preset</label>
            <select id="reverbPreset" style="width:100%;margin-top:6px;padding:4px;">
                <option value="null">Off</option>
                <option value="ambience">Ambience</option>
                <option value="chamber">Chamber</option>
                <option value="hall">Hall</option>
                <option value="plate">Plate</option>
                <option value="space">Space</option>
            </select>
        </div>
        <div class="control" style="margin-top:10px;">
            <label>Reverb Depth: <span id="reverbWetVal">0%</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="reverbWet" min="0" max="100" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>

        </div>
    </details>

    <!-- Стало -->
    <details id="stereoPanel">
        <summary>
            <div class="summary-container"><span>Stereo</span>
                <div class="reset-icon" data-section="#stereoPanel"></div>
            </div>
        </summary>

        <div class="control" style="margin-top:10px;">
            <label>Width: <span id="stereoWidthMixVal">0%</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="stereoWidthMix" min="0" max="100" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>

        <div class="control" style="margin-top:10px;">
            <label>Center Cancel: <span id="centerCancelVal">0</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="centerCancel" min="0" max="100" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>

        <div class="control" style="margin-top:10px;">
            <label>Center: <span id="stereoCenterMixVal">0%</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="stereoCenterMix" min="0" max="100" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>

        <div class="control" style="margin-top:10px;">
            <label>Focus: <span id="stereoFocusMixVal">0%</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="stereoFocusMix" min="0" max="100" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>

        <div class="control" style="margin-top:10px;">
            <label>Balance: <span id="channelBalanceVal">0</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="channelBalance" min="-100" max="100" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
    </details>

    <details id="bassPanel">
        <summary>
            <div class="summary-container"><span>Bass</span>
                <div class="reset-icon" data-section="#bassPanel"></div>
            </div>
        </summary>
        <div class="control" style="margin-top:10px;"><label>Subbass: <span id="subbassMixVal">0%</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="subbassMix" min="0" max="100" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control" style="margin-top:10px;"><label>Warmth: <span id="warmthMixVal">0%</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="warmthMix" min="0" max="100" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
    </details>

    <details id="clarityPanel">
        <summary>
            <div class="summary-container"><span>Clarity</span>
                <div class="reset-icon" data-section="#clarityPanel"></div>
            </div>
        </summary>
        <div class="control" style="margin-top:10px;"><label>Definition: <span id="definitionMixVal">0%</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="definitionMix" min="0" max="100" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
    </details>

    <details id="delayPanel">
        <summary>
            <div class="summary-container"><span>Delay</span>
                <div class="reset-icon" data-section="#delayPanel"></div>
            </div>
        </summary>
        <div class="control" style="margin-top:10px;">
            <label>Time: <span id="delayTimeVal">250 ms</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="delayTime" min="10" max="1000" step="1" value="250">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control" style="margin-top:10px;">
            <label>Feedback: <span id="delayFeedbackVal">40%</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="delayFeedback" min="0" max="90" step="1" value="40">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control" style="margin-top:10px;">
            <label>Mix: <span id="delayMixVal">0%</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="delayMix" min="0" max="100" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>

        <!-- ЗАРЕЗЕРВИРОВАНО ДЛЯ БУДУЩЕГО BPM SYNC -->
        <div class="row" style="margin-top:12px; opacity: 0.5; pointer-events: none;">
            <input type="checkbox" id="delayBpmSync" disabled>
            <label>Sync to BPM</label>
            <input type="number" id="delayBpmValue" value="120" min="40" max="300" style="width: 50px; margin-left: 8px; padding: 2px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;" disabled>
            <span style="margin-left: 4px; font-size: 12px;">BPM</span>
        </div>
    </details>

    <details id="distortionPanel">
        <summary>
            <div class="summary-container"><span>Lo-Fi</span>
                <div class="reset-icon" data-section="#distortionPanel"></div>
            </div>
        </summary>
        <div class="modulation-layers" style="display:flex;gap:8px;align-items:center;">
            <select id="lofiLayer">
                <option value="distortion">Distortion</option>
                <option value="bitcrusher">Bitcrusher</option>
                <option value="cdskipper">CD Skipper</option>
                <option value="vinyl">Vinyl</option>
            </select>
            <button id="lofiLayerAddBtn" class="btn-vk link" type="button">Add Layer</button>
        </div>
        <div id="lofi-items" class="layers-items"></div>

        <div class="control" style="margin-top:10px;">
            <label>Mix: <span id="distMixVal">0%</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="distMix" min="0" max="100" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
    </details>

    <details id="dynamicsPanel">
        <summary>
            <div class="summary-container"><span>Dynamics</span>
                <div class="reset-icon" data-section="#dynamicsPanel"></div>
            </div>
        </summary>

        <div class="control"><label>Threshold: <span id="compressorThresholdVal">-24 dB</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="compressorThreshold" min="-60" max="0" step="1" value="-24">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control"><label>Knee: <span id="compressorKneeVal">30 dB</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="compressorKnee" min="0" max="40" step="1" value="30">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control"><label>Ratio: <span id="compressorRatioVal">12:1</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="compressorRatio" min="1" max="20" step="0.5" value="12">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control"><label>Attack: <span id="compressorAttackVal">3 ms</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="compressorAttack" min="0" max="100" step="1" value="3">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control"><label>Release: <span id="compressorReleaseVal">250 ms</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="compressorRelease" min="10" max="1000" step="10" value="250">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
    </details>
    <details id="surroundPanel">
        <summary>
            <div class="summary-container"><span>Surround</span>
                <div class="reset-icon" data-section="#surroundPanel"></div>
            </div>
        </summary>
        <div class="row"><input type="checkbox" id="dolbyEnabled"><label>DOLBY Surround Upmix (5.1)</label></div>
    </details>

    <details id="modulationPanel">
        <summary>
            <div class="summary-container"><span>Modulation</span>
                <div class="reset-icon" data-section="#modulationPanel"></div>
            </div>
        </summary>
        <div class="modulation-layers" style="display:flex;gap:8px;align-items:center;">
            <select id="modulationLayer">
                <option value="chorus">Chorus</option>
                <option value="flanger">Flanger</option>
                <option value="phaser">Phaser</option>
                <option value="tremolo">Tremolo</option>
                <option value="Vibrato">Vibrato</option>
                <option value="rotarySpeaker">Rotary Speaker</option>
                <option value="ringModulator">Ring Modulator</option>
                <option value="vowelFilter">Vowel Filter</option>
                <option value="autoPanner">Auto Panner</option>
                <option value="autoFilter">Auto Filter</option>
            </select>
            <button id="modulationLayerAddBtn" class="btn-vk link" type="button">Add Layer</button>
        </div>

        <div id="modulation-items" class="layers-items"></div>
    </details>

    <div class="row">
        <input type="checkbox" id="optimisationDelay">
        <label>Optimization delay</label>
    </div>
    <div class="row controls">

        <div class="select-row">
            <span>Preset:</span>
            <select id="globalPresetSelect">
                <option value="default">Default</option>
            </select>
            <div class="row">
                <input type="checkbox" id="overlay">
                <label>Overlay</label>
            </div>
        </div>
        <div class="button-row">
            <button id="blacklistBtn" class="btn-vk" type="button">Blacklist</button>
            <button id="resetBtn" class="btn-vk" type="button">Reset</button>
            <button id="globalPresetsBtn" class="btn-vk" type="button">Presets</button>
            <div id="siteStatus"><span id="siteStatusDot"></span><span id="siteStatusText">active</span></div>
        </div>

    </div>
    <div id="blacklistModal" class="simple-modal" aria-hidden="true">
        <div class="simple-modal__backdrop"></div>
        <div class="simple-modal__panel">
            <div class="simple-modal__header">
                <div style="font-weight:600;">Blacklist</div> <button class="close" type="button">×</button>
            </div>
            <div class="simple-modal__add"><input id="blacklistInput" type="text" placeholder="https://www.youtube.com/*" spellcheck="false" /><button id="blacklistAddBtn" class="btn-vk" type="button">Add</button></div>
            <div id="blacklistList" class="blacklist-list"></div>
        </div>
    </div>

    <div id="eqPresetModal" class="simple-modal" aria-hidden="true">
        <div class="simple-modal__backdrop"></div>
        <div class="simple-modal__panel">
            <div class="simple-modal__header">
                <div style="font-weight:600;">Equalizer Presets</div> <button class="close" type="button">×</button>
            </div>
            <div class="simple-modal__add" style="flex-wrap:wrap;gap:6px;">
                <input id="eqPresetNameInput" type="text" placeholder="EQ Preset name" spellcheck="false" style="flex:1;min-width:100px;" />
                <input id="eqPresetGenresInput" type="text" placeholder="Genres (rock, pop)" spellcheck="false" style="flex:1;min-width:100px;" />
                <button id="eqPresetAddBtn" class="btn-vk" type="button">Save Current</button>
            </div>
            <div id="eqPresetList" class="blacklist-list"></div>
        </div>
    </div>

    <div id="globalPresetModal" class="simple-modal" aria-hidden="true">
        <div class="simple-modal__backdrop"></div>
        <div class="simple-modal__panel">
            <div class="simple-modal__header">
                <div style="font-weight:600;">Presets</div>
                <button class="close" type="button">×</button>
            </div>
            <div class="simple-modal__add" style="flex-wrap:wrap;gap:6px;">
                <input id="globalPresetNameInput" type="text" placeholder="Preset name" spellcheck="false" style="flex:1;min-width:100px;" />
                <button id="globalPresetAddBtn" class="btn-vk" type="button">Save Current</button>
            </div>
            <div id="globalPresetList" class="blacklist-list"></div>
        </div>
    </div>

    <script src="src/js/simple-modal.js"></script>
    <script src="popup.js"></script>
</body>

</html>
