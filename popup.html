<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="src/css/unsonet-styles.css" />
    <link rel="stylesheet" type="text/css" href="popup.css" />
</head>

<body>
    <details id="volumeBoostPanel" open>
        <summary>
            <div class="summary-container">
                <span>Volume</span>
                <div class="reset-icon" data-section="#volumeBoostPanel"></div>
            </div>
        </summary>
        <div class="control">
            <label>Gain: <span id="volumeBoostVal">0 dB</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="volumeBoostDb" min="-24" max="24" step="0.5" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
    </details>
    <details id="pitchSettingsPanel">
        <summary>
            <div class="summary-container">
                <span>Pitch</span>
                <div class="reset-icon" data-section="#pitchSettingsPanel"></div>
            </div>
        </summary>
        <div class="control">
            <label>Pitch Shift (semitones): <span id="semitonesVal">0</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="semitones" min="-12" max="12" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control">
            <label>Pitch Fine Shifting (cents): <span id="centsVal">0</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="cents" min="-50" max="50" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control">
            <label>Block Size (ms): <span id="blockSizeVal">120</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="blockSize" min="20" max="150" step="5" value="120">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="row">
            <input type="checkbox" id="smartProcessing" checked>
            <label>Smart processing</label>
        </div>
    </details>
    <details id="speedSettingsPanel">
        <summary>
            <div class="summary-container">
                <span>Speed</span>
                <div class="reset-icon" data-section="#speedSettingsPanel"></div>
            </div>
        </summary>
        <div class="control">
            <label>Speed Shift: <span id="speedUnitsVal">100%</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="speedUnits" min="-75" max="60" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control">
            <label>Speed Fine Shifting: <span id="speedFineVal">100%</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="speedFine" min="-5" max="5" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="row">
            <input type="checkbox" id="preservePitch" checked>
            <label>Preserve pitch</label>
        </div>
    </details>
    <details id="eqSettingsPanel">
        <summary>
            <div class="summary-container">
                <span>Equalizer</span>
                <div class="reset-icon" data-section="#eqSettingsPanel"></div>
            </div>
        </summary>
        <div class="eq-presets" style="display:flex;gap:8px;align-items:center;">
            <select id="eqPreset">
                <option value="flat">Flat</option>
                <option value="rock">Rock</option>
                <option value="pop">Pop</option>
                <option value="classical">Classical</option>
                <option value="bass">Bass Boost</option>
            </select>
            <button id="eqPresetManageBtn" class="btn-vk link" type="button">Manage</button>
        </div>
        <div class="eq-row">
            <div class="eq-container">
                <svg class="eq-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path class="eq-svg-line-shadow" d=""></path>
                    <path class="eq-svg-line" d=""></path>
                </svg>
                <div class="range-slider" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                </div>
                <div class="range-slider" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                </div>
                <div class="range-slider" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                </div>
                <div class="range-slider" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                </div>
                <div class="range-slider" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                </div>
                <div class="range-slider" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                </div>
                <div class="range-slider" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                </div>
                <div class="range-slider" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                </div>
                <div class="range-slider" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                </div>
                <div class="range-slider" style="--orientation: vertical;"><input type="range" orient="vertical" min="0" max="100" value="50">
                    <div class="range-slider__track"></div>
                    <div class="range-slider__bar"></div>
                    <div class="range-slider__thumb"></div>
                </div>
            </div>
        </div>
    </details>


    <details id="spatialSettingsPanel">
        <summary>
            <div class="summary-container">
                <span>Spatial</span>
                <div class="reset-icon" data-section="#spatialSettingsPanel"></div>
            </div>
        </summary>
        <div class="control">
            <label>Reverb Preset</label>
            <select id="reverbPreset" style="width:100%;margin-top:6px;padding:4px;">
                <option value="null">Off</option>
                <option value="ambience">Ambience</option>
                <option value="chamber">Chamber</option>
                <option value="hall">Hall</option>
                <option value="plate">Plate</option>
                <option value="space">Space</option>
            </select>
        </div>
        <div class="control" style="margin-top:10px;">
            <label>Reverb Depth: <span id="reverbWetVal">0%</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="reverbWet" min="0" max="100" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control" style="margin-top:10px;">
            <label>Stereo Widener: <span id="stereoWidenVal">0</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="stereoWiden" min="0" max="100" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control" style="margin-top:10px;">
            <label>Channel Balance: <span id="channelBalanceVal">0</span></label>
            <div class="range-slider" style="--orientation: horizontal;">
                <input type="range" id="channelBalance" min="-100" max="100" step="1" value="0">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
    </details>

    <details id="dynamicsPanel">
        <summary>
            <div class="summary-container"><span>Dynamics</span>
                <div class="reset-icon" data-section="#dynamicsPanel"></div>
            </div>
        </summary>

        <div class="control"><label>Threshold: <span id="compressorThresholdVal">-24 dB</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="compressorThreshold" min="-60" max="0" step="1" value="-24">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control"><label>Knee: <span id="compressorKneeVal">30 dB</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="compressorKnee" min="0" max="40" step="1" value="30">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control"><label>Ratio: <span id="compressorRatioVal">12:1</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="compressorRatio" min="1" max="20" step="0.5" value="12">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control"><label>Attack: <span id="compressorAttackVal">3 ms</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="compressorAttack" min="0" max="100" step="1" value="3">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
        <div class="control"><label>Release: <span id="compressorReleaseVal">250 ms</span></label>
            <div class="range-slider" style="--orientation: horizontal;"><input type="range" id="compressorRelease" min="10" max="1000" step="10" value="250">
                <div class="range-slider__track"></div>
                <div class="range-slider__bar"></div>
                <div class="range-slider__thumb"></div>
            </div>
        </div>
    </details>
    <details id="surroundPanel">
        <summary>
            <div class="summary-container"><span>Surround</span>
                <div class="reset-icon" data-section="#surroundPanel"></div>
            </div>
        </summary>
        <div class="row"><input type="checkbox" id="dolbyEnabled"><label>DOLBY Surround Upmix (5.1)</label></div>
    </details>

    <div class="row">
        <input type="checkbox" id="optimisationDelay">
        <label>Optimization delay</label>
    </div>
    <div class="row controls">

        <div class="select-row">
            <span>Preset:</span>
            <select id="globalPresetSelect">
                <option value="default">Default</option>
            </select>
            <div class="row">
                <input type="checkbox" id="overlay">
                <label>Overlay</label>
            </div>
        </div>
        <div class="button-row">
            <button id="blacklistBtn" class="btn-vk" type="button">Blacklist</button>
            <button id="resetBtn" class="btn-vk" type="button">Reset</button>
            <button id="globalPresetsBtn" class="btn-vk" type="button">Presets</button>
            <div id="siteStatus"><span id="siteStatusDot"></span><span id="siteStatusText">active</span></div>
        </div>

    </div>
    <div id="blacklistModal" class="simple-modal" aria-hidden="true">
        <div class="simple-modal__backdrop"></div>
        <div class="simple-modal__panel">
            <div class="simple-modal__header">
                <div style="font-weight:600;">Blacklist</div> <button class="close" type="button">×</button>
            </div>
            <div class="simple-modal__add"><input id="blacklistInput" type="text" placeholder="https://www.youtube.com/*" spellcheck="false" /><button id="blacklistAddBtn" class="btn-vk" type="button">Add</button></div>
            <div id="blacklistList" class="blacklist-list"></div>
        </div>
    </div>

    <div id="eqPresetModal" class="simple-modal" aria-hidden="true">
        <div class="simple-modal__backdrop"></div>
        <div class="simple-modal__panel">
            <div class="simple-modal__header">
                <div style="font-weight:600;">Equalizer Presets</div> <button class="close" type="button">×</button>
            </div>
            <div class="simple-modal__add" style="flex-wrap:wrap;gap:6px;">
                <input id="eqPresetNameInput" type="text" placeholder="EQ Preset name" spellcheck="false" style="flex:1;min-width:100px;" />
                <input id="eqPresetGenresInput" type="text" placeholder="Genres (rock, pop)" spellcheck="false" style="flex:1;min-width:100px;" />
                <button id="eqPresetAddBtn" class="btn-vk" type="button">Save Current</button>
            </div>
            <div id="eqPresetList" class="blacklist-list"></div>
        </div>
    </div>

    <div id="globalPresetModal" class="simple-modal" aria-hidden="true">
    <div class="simple-modal__backdrop"></div>
    <div class="simple-modal__panel">
        <div class="simple-modal__header">
            <div style="font-weight:600;">Presets</div>
            <button class="close" type="button">×</button>
        </div>
        <div class="simple-modal__add" style="flex-wrap:wrap;gap:6px;">
            <input id="globalPresetNameInput" type="text" placeholder="Preset name" spellcheck="false" style="flex:1;min-width:100px;" />
            <button id="globalPresetAddBtn" class="btn-vk" type="button">Save Current</button>
        </div>
        <div id="globalPresetList" class="blacklist-list"></div>
    </div>
</div>

    <script src="src/js/simple-modal.js"></script>
    <script src="popup.js"></script>
</body>

</html>
